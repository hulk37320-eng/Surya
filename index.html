<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HabitFlow — Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ── Reset & Root ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#eef2ff;
  --surface:#ffffff;
  --surface2:#f5f7ff;
  --border:#dde4f8;
  --text:#1a1f3c;
  --text2:#6b7a99;
  --blue:#4361ee;
  --blue2:#7c3aed;
  --blue-light:#eef2ff;
  --green:#10b981;
  --amber:#f59e0b;
  --red:#ef4444;
  --pink:#ec4899;
  --radius:16px;
  --shadow:0 4px 24px rgba(67,97,238,.10);
  --shadow-sm:0 2px 10px rgba(67,97,238,.08);
  --transition:.2s cubic-bezier(.4,0,.2,1);
}
.dark{
  --bg:#0d1117;
  --surface:#161b27;
  --surface2:#1e2436;
  --border:#252d44;
  --text:#e2e8f8;
  --text2:#8892b0;
  --blue-light:#1a2040;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
html{scroll-behavior:smooth;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--transition),color var(--transition);}

/* ── Layout ────────────────────────────────────────────────────────── */
.app{display:flex;min-height:100vh;}

/* ── Sidebar ────────────────────────────────────────────────────────── */
.sidebar{
  width:230px;flex-shrink:0;background:var(--surface);border-right:1.5px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  transition:background var(--transition),border-color var(--transition);z-index:10;
}
.logo{padding:28px 22px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);}
.logo-icon{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:linear-gradient(135deg,var(--blue),var(--blue2));flex-shrink:0;
  box-shadow:0 4px 14px rgba(67,97,238,.35);
}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px;}
.logo-tag{font-size:10px;color:var(--text2);margin-top:1px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;}
.nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.nav-item{
  padding:11px 14px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:11px;transition:all var(--transition);color:var(--text2);
  user-select:none;position:relative;
}
.nav-item:hover{background:var(--blue-light);color:var(--blue);}
.nav-item.active{background:linear-gradient(135deg,rgba(67,97,238,.15),rgba(124,58,237,.1));color:var(--blue);font-weight:700;}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:linear-gradient(var(--blue),var(--blue2));border-radius:0 3px 3px 0;}
.nav-icon{font-size:17px;width:22px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--blue);color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:2px 7px;}
.sidebar-footer{padding:14px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px;}

/* ── Main ────────────────────────────────────────────────────────────── */
.main{flex:1;padding:32px 36px;min-width:0;overflow-y:auto;}
.page{display:none;}
.page.active{display:block;animation:pageIn .3s ease;}
@keyframes pageIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ── Page Header ─────────────────────────────────────────────────────── */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:14px;}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.2;}
.page-subtitle{font-size:13px;color:var(--text2);margin-top:3px;font-weight:400;}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

/* ── Stat Cards ──────────────────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:18px 16px;display:flex;align-items:flex-start;gap:12px;
  box-shadow:var(--shadow-sm);transition:transform var(--transition),box-shadow var(--transition);
}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.stat-icon{font-size:22px;line-height:1;flex-shrink:0;}
.stat-val{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;color:var(--accent,var(--blue));}
.stat-lbl{font-size:10.5px;color:var(--text2);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;}

/* ── Streak Badges ───────────────────────────────────────────────────── */
.streak-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:22px;}
.streak-badge{
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  padding:16px 12px;text-align:center;box-shadow:var(--shadow-sm);
  transition:transform var(--transition);cursor:default;
}
.streak-badge:hover{transform:translateY(-3px);}
.sb-val{
  font-size:28px;font-weight:800;font-family:'JetBrains Mono',monospace;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.sb-lbl{font-size:10.5px;color:var(--text2);margin-top:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}

/* ── Chart Cards ─────────────────────────────────────────────────────── */
.chart-card{
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow-sm);margin-bottom:22px;
}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.chart-title{font-size:14px;font-weight:700;letter-spacing:-.2px;}
.chart-badge{font-size:11px;background:var(--blue-light);color:var(--blue);padding:4px 12px;border-radius:20px;font-weight:700;border:1px solid rgba(67,97,238,.2);}
.chart-wrap{position:relative;}

/* ── Two column ──────────────────────────────────────────────────────── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}

/* ── Week Grid ───────────────────────────────────────────────────────── */
.week-nav-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.week-nav-label{font-size:13.5px;font-weight:700;color:var(--text);}
.week-nav-btns{display:flex;gap:8px;align-items:center;}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:22px;}
.day-cell{
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  padding:12px 6px;text-align:center;cursor:pointer;transition:all var(--transition);
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
