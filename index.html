<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Master Pro | 16-Week Analytics</title>
    <style>
        :root { --navy: #1e3a8a; --blue: #3b82f6; --bg: #f8fafc; --border: #cbd5e1; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); margin: 0; padding: 15px; }

        /* Header Area */
        .header { background: white; padding: 25px; border-radius: 20px; border-bottom: 8px solid var(--navy); display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        #clock { font-size: 26px; font-weight: 800; color: var(--navy); }
        .btn-add { background: var(--blue); color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btn-next { background: #10b981; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-right: 10px; }

        /* Dashboard Layout */
        .analytics-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media (max-width: 1000px) { .analytics-grid { grid-template-columns: 1fr; } }

        .card { background: white; padding: 25px; border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* THE BIG GRAPH */
        .big-wave-container { width: 100%; height: 250px; position: relative; }
        .wave-svg { width: 100%; height: 100%; overflow: visible; }
        .wave-path { fill: rgba(59, 130, 246, 0.1); stroke: var(--blue); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
        .wave-dot { fill: white; stroke: var(--blue); stroke-width: 4; }

        /* Pie Charts */
        .pie-box { position: relative; width: 140px; height: 140px; border-radius: 50%; margin: 15px 0; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        .pie-inner { position: absolute; width: 105px; height: 105px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: var(--navy); }

        /* Spreadsheet Table */
        .table-wrap { background: white; padding: 20px; border-radius: 20px; overflow-x: auto; border: 1px solid var(--border); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { background: var(--navy); color: white; padding: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 15px; border: 1px solid #eef2f6; text-align: center; font-size: 16px; }
        .h-name { text-align: left; font-weight: 700; color: #334155; }
        input[type="checkbox"] { width: 26px; height: 26px; cursor: pointer; accent-color: var(--navy); }
        .footer { background: var(--navy); color: white; font-weight: 800; font-size: 18px; }

        /* HISTORY LOG */
        .history-section { margin-top: 50px; }
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .hist-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid var(--border); transition: 0.3s; }
        .hist-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .hist-head { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 15px; color: var(--navy); font-size: 18px; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1 style="margin:0; font-size: 26px; color: var(--navy);">Master Goal Tracker</h1>
        <div id="clock">00:00:00</div>
        <div id="week-tag" style="color:var(--blue); font-weight:bold; font-size:14px; margin-top:5px;">ACTIVE STATUS: WEEK 1</div>
    </div>
    <div>
        <button class="btn-next" onclick="finishWeek()">COMPLETE & ARCHIVE WEEK</button>
        <button class="btn-add" onclick="document.getElementById('modal').style.display='flex'">+ NEW GOAL</button>
    </div>
</div>

<div class="analytics-grid">
    <div class="card">
        <h3 style="margin:0 0 15px 0; color:#64748b;">CURRENT WEEKLY TREND</h3>
        <div class="big-wave-container">
            <svg class="wave-svg" viewBox="0 0 700 100" id="mainGraph"></svg>
        </div>
        <div style="display:flex; justify-content:space-between; width:100%; padding:0 30px; font-weight:800; color:var(--navy); font-size:12px;">
            <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
        </div>
    </div>

    <div class="card">
        <small style="font-weight:bold; color:#64748b;">WEEKLY TARGET</small>
        <div id="weekPie" class="pie-box">
            <div id="weekText" class="pie-inner">0%</div>
        </div>
        <b id="remText" style="color:var(--blue)">0 Checks Left</b>
    </div>

    <div class="card">
        <small style="font-weight:bold; color:#64748b;">4-MONTH PROGRESS</small>
        <div id="overPie" class="pie-box">
            <div id="overText" class="pie-inner">0%</div>
        </div>
        <b style="color:var(--navy)">Total Goal Journey</b>
    </div>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>#</th><th class="h-name">HABIT DESCRIPTION</th>
                <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
                <th style="background:var(--blue)">%</th>
            </tr>
        </thead>
        <tbody id="habitBody"></tbody>
        <tfoot>
            <tr class="footer">
                <td colspan="2" style="text-align:left; padding-left:20px">DAILY TOTALS</td>
                <td id="c0">0%</td><td id="c1">0%</td><td id="c2">0%</td><td id="c3">0%</td><td id="c4">0%</td><td id="c5">0%</td><td id="c6">0%</td>
                <td id="rowTotal" style="background:var(--blue)">0%</td>
            </tr>
        </tfoot>
    </table>
</div>

<div class="history-section">
    <h2 style="color:var(--navy); border-left: 8px solid var(--blue); padding-left: 15px; margin-bottom: 25px;">PAST WEEKS & GRAPH HISTORY</h2>
    <div class="history-grid" id="historyBox"></div>
</div>

<div id="modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:1000;">
    <div style="background:white; padding:40px; border-radius:25px; width:400px; text-align:center;">
        <h2 style="margin-top:0;">Add New Goal</h2>
        <input type="text" id="habitIn" placeholder="Enter habit name..." style="width:100%; padding:15px; border:2px solid #eee; border-radius:12px; margin-bottom:25px; font-size:18px;">
        <button class="btn-add" style="width:100%" onclick="addHabit()">SAVE TO LIST</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:15px; background:none; border:none; color:gray; cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
    let habits = JSON.parse(localStorage.getItem('MASTER_V12_HABITS')) || [];
    let weekNum = parseInt(localStorage.getItem('MASTER_V12_WEEK')) || 1;
    let history = JSON.parse(localStorage.getItem('MASTER_V12_HIST')) || [];

    function addHabit() {
        const val = document.getElementById('habitIn').value;
        if(!val) return;
        habits.push({ name: val, checks: [false,false,false,false,false,false,false] });
        save();
        document.getElementById('modal').style.display='none';
        document.getElementById('habitIn').value = '';
    }

    function toggle(hIdx, dIdx) {
        habits[hIdx].checks[dIdx] = !habits[hIdx].checks[dIdx];
        save();
    }

    function finishWeek() {
        if(!confirm(`Archive Week ${weekNum} and start Week ${weekNum + 1}?`)) return;
        
        let dStats = [0,0,0,0,0,0,0];
        habits.forEach(h => h.checks.forEach((c, i) => { if(c) dStats[i]++; }));
        
        const done = habits.reduce((acc, h) => acc + h.checks.filter(c => c).length, 0);
        const total = habits.length * 7;
        const score = total ? Math.round((done/total)*100) : 0;

        // Archive the data including the graph stats
        history.push({ 
            wk: weekNum, 
            score: score, 
            stats: dStats, 
            count: habits.length,
            details: habits.map(h => ({n: h.name, s: Math.round((h.checks.filter(c=>c).length/7)*100)}))
        });

        weekNum++;
        habits.forEach(h => h.checks = [false,false,false,false,false,false,false]);
        save();
    }

    function save() {
        localStorage.setItem('MASTER_V12_HABITS', JSON.stringify(habits));
        localStorage.setItem('MASTER_V12_WEEK', weekNum);
        localStorage.setItem('MASTER_V12_HIST', JSON.stringify(history));
        render();
    }

    function generateWave(stats, count, height=100) {
        if(!count) return "";
        let path = `M 50 ${height}`;
        let dots = "";
        stats.forEach((s, i) => {
            const pct = Math.round((s/count)*100);
            const x = (i * 100) + 50;
            const y = height - (pct * (height/100));
            path += ` L ${x} ${y}`;
            dots += `<circle cx="${x}" cy="${y}" r="6" class="wave-dot" />`;
        });
        path += ` L 650 ${height} Z`;
        return `<path d="${path}" class="wave-path"></path>${dots}`;
    }

    function render() {
        const body = document.getElementById('habitBody');
        let tDone = 0, tPoss = habits.length * 7, dStats = [0,0,0,0,0,0,0];

        body.innerHTML = habits.map((h, hIdx) => {
            const hDone = h.checks.filter((c, i) => { if(c) dStats[i]++; return c; }).length;
            tDone += hDone;
            return `<tr><td>${hIdx+1}</td><td class="h-name">${h.name}</td>
                ${h.checks.map((c, dIdx) => `<td><input type="checkbox" ${c?'checked':''} onchange="toggle(${hIdx},${dIdx})"></td>`).join('')}
                <td style="font-weight:bold; color:var(--blue)">${Math.round((hDone/7)*100)||0}%</td></tr>`;
        }).join('');

        const weeklyPct = tPoss ? Math.round((tDone/tPoss)*100) : 0;
        
        // Update Graphics
        document.getElementById('mainGraph').innerHTML = generateWave(dStats, habits.length);
        document.getElementById('weekPie').style.background = `conic-gradient(var(--blue) ${weeklyPct}%, #eee 0%)`;
        document.getElementById('weekText').innerText = weeklyPct + "%";
        document.getElementById('remText').innerText = (tPoss - tDone) + " Checks Left";

        const overSum = history.reduce((acc, h) => acc + h.score, 0) + weeklyPct;
        const overallPct = Math.round(overSum / weekNum);
        document.getElementById('overPie').style.background = `conic-gradient(var(--navy) ${overallPct}%, #eee 0%)`;
        document.getElementById('overText').innerText = overallPct + "%";

        dStats.forEach((s, i) => document.getElementById(`c${i}`).innerText = (habits.length ? Math.round((s/habits.length)*100) : 0) + '%');
        document.getElementById('rowTotal').innerText = weeklyPct + '%';
        document.getElementById('week-tag').innerText = `ACTIVE STATUS: WEEK ${weekNum} / 16`;

        // Render Past Week History with Graphs
        document.getElementById('historyBox').innerHTML = history.slice().reverse().map(h => `
            <div class="hist-card">
                <div class="hist-head"><span>WEEK ${h.wk}</span><span>${h.score}%</span></div>
                <svg viewBox="0 0 700 100" style="width:100%; height:80px; margin-bottom:10px;">${generateWave(h.stats, h.count)}</svg>
                <div style="font-size:12px; border-top:1px solid #eee; padding-top:10px;">
                    ${h.details.map(d => `<div style="display:flex; justify-content:space-between; margin-bottom:3px;">
                        <span>${d.n}</span><b>${d.s}%</b>
                    </div>`).join('')}
                </div>
            </div>
        `).join('') || '<p style="color:gray">Complete Week 1 to unlock your history log.</p>';
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    render();
</script>
</body>
</html>
