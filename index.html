<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow Pro | Full Control</title>
    <style>
        :root { --navy: #1e3a8a; --blue: #3b82f6; --bg: #f8fafc; --border: #cbd5e1; --red: #ef4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); margin: 0; padding: 15px; color: #334155; }

        /* Header Layout */
        .header { background: white; padding: 20px; border-radius: 20px; border-bottom: 6px solid var(--navy); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        #clock { font-size: 24px; font-weight: 800; color: var(--navy); }
        .controls { display: flex; gap: 8px; }
        
        .btn { border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-add { background: var(--blue); color: white; }
        .btn-next { background: #10b981; color: white; }
        .btn-reset { background: #fee2e2; color: var(--red); }
        
        /* Action Buttons in Table */
        .action-btns { display: flex; gap: 5px; justify-content: center; }
        .btn-edit { background: #dbeafe; color: var(--blue); border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
        .btn-del { background: #fee2e2; color: var(--red); border: none; padding: 5px 8px; border-radius: 5px; cursor: pointer; }

        /* Dash Analytics */
        .dash-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        @media (max-width: 1000px) { .dash-grid { grid-template-columns: 1fr; } }
        .card { background: white; padding: 25px; border-radius: 20px; border: 1px solid var(--border); text-align: center; }
        
        /* Big Wave Graph */
        .wave-svg { width: 100%; height: 200px; overflow: visible; }
        .wave-path { fill: rgba(59, 130, 246, 0.1); stroke: var(--blue); stroke-width: 6; stroke-linecap: round; }
        .wave-dot { fill: white; stroke: var(--blue); stroke-width: 4; }

        /* Pie Charts */
        .pie { position: relative; width: 130px; height: 130px; border-radius: 50%; margin: 10px auto; display: flex; align-items: center; justify-content: center; }
        .pie-inner { position: absolute; width: 100px; height: 100px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: var(--navy); }

        /* Table Spreadsheet */
        .table-wrap { background: white; padding: 15px; border-radius: 20px; overflow-x: auto; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { background: var(--navy); color: white; padding: 12px; font-size: 13px; }
        td { padding: 12px; border: 1px solid #f1f5f9; text-align: center; }
        .h-name { text-align: left; font-weight: 700; color: #1e293b; min-width: 200px; }
        input[type="checkbox"] { width: 26px; height: 26px; cursor: pointer; accent-color: var(--navy); }
        .footer { background: var(--navy); color: white; font-weight: 800; }

        /* History */
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-top: 20px; }
        .hist-card { background: white; padding: 15px; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1 style="margin:0; font-size: 20px;">HABITFLOW <span style="color:var(--blue)">MASTER</span></h1>
        <div id="clock">00:00:00</div>
        <div id="week-label" style="color:var(--blue); font-weight:bold; font-size:12px;">WEEK 1 / 16</div>
    </div>
    <div class="controls">
        <button class="btn btn-reset" onclick="fullReset()">RESET ALL</button>
        <button class="btn btn-next" onclick="archiveWeek()">FINISH WEEK</button>
        <button class="btn btn-add" onclick="openModal()">+ NEW GOAL</button>
    </div>
</div>

<div class="dash-grid">
    <div class="card">
        <h3 style="margin:0 0 10px 0; color:#64748b; font-size:12px">WEEKLY PERFORMANCE TREND</h3>
        <svg class="wave-svg" viewBox="0 0 700 100" id="mainGraph"></svg>
        <div style="display:flex; justify-content:space-between; padding:0 30px; font-weight:bold; font-size:10px;">
            <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
        </div>
    </div>
    <div class="card">
        <small style="font-weight:bold">WEEKLY SCORE</small>
        <div id="wPie" class="pie">
            <div id="wText" class="pie-inner">0%</div>
        </div>
        <div id="wCount" style="font-weight:bold; color:var(--blue); font-size:12px">0 / 0 DONE</div>
    </div>
    <div class="card">
        <small style="font-weight:bold">4-MONTH TOTAL</small>
        <div id="oPie" class="pie">
            <div id="oText" class="pie-inner">0%</div>
        </div>
        <div style="font-weight:bold; color:var(--navy); font-size:12px">OVERALL JOURNEY</div>
    </div>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th class="h-name">GOAL DESCRIPTION</th>
                <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
                <th style="background:var(--blue)">%</th>
            </tr>
        </thead>
        <tbody id="habitBody"></tbody>
        <tfoot>
            <tr class="footer">
                <td colspan="2" style="text-align:left; padding-left:20px;">DAILY AVERAGES</td>
                <td id="c0">0%</td><td id="c1">0%</td><td id="c2">0%</td><td id="c3">0%</td><td id="c4">0%</td><td id="c5">0%</td><td id="c6">0%</td>
                <td id="rowTotal" style="background:var(--blue)">0%</td>
            </tr>
        </tfoot>
    </table>
</div>

<h2 style="color:var(--navy); border-left: 6px solid var(--blue); padding-left: 15px; margin-top: 40px;">PAST WEEKS HISTORY</h2>
<div class="history-grid" id="historyBox"></div>

<div id="modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:1000;">
    <div style="background:white; padding:30px; border-radius:20px; width:400px; text-align:center;">
        <h2 id="modalTitle">New Goal</h2>
        <input type="text" id="habitIn" style="width:100%; padding:12px; border:2px solid #eee; border-radius:10px; margin-bottom:20px; font-size:16px;">
        <button class="btn btn-add" style="width:100%" onclick="saveHabit()">SAVE GOAL</button>
        <button onclick="closeModal()" style="margin-top:10px; background:none; border:none; color:gray; cursor:pointer;">Cancel</button>
    </div>
</div>

<script>
    let habits = JSON.parse(localStorage.getItem('HF_FINAL_X_DATA')) || [];
    let weekNum = parseInt(localStorage.getItem('HF_FINAL_X_WK')) || 1;
    let history = JSON.parse(localStorage.getItem('HF_FINAL_X_HIST')) || [];
    let editingIndex = -1;

    function openModal(idx = -1) {
        editingIndex = idx;
        document.getElementById('modalTitle').innerText = idx === -1 ? "New Goal" : "Edit Goal";
        document.getElementById('habitIn').value = idx === -1 ? "" : habits[idx].name;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function saveHabit() {
        const val = document.getElementById('habitIn').value;
        if(!val) return;
        if(editingIndex === -1) {
            habits.push({ name: val, checks: Array(7).fill(false) });
        } else {
            habits[editingIndex].name = val;
        }
        update(); closeModal();
    }

    function removeHabit(idx) {
        if(confirm(`Remove "${habits[idx].name}" from your list?`)) {
            habits.splice(idx, 1);
            update();
        }
    }

    function fullReset() {
        if(confirm("Delete ALL habits and history? You will restart at Week 1.")) {
            habits = []; weekNum = 1; history = []; update();
        }
    }

    function toggle(hIdx, dIdx) {
        habits[hIdx].checks[dIdx] = !habits[hIdx].checks[dIdx];
        update();
    }

    function archiveWeek() {
        if(!confirm(`Archive Week ${weekNum} and reset the board?`)) return;
        let dStats = Array(7).fill(0);
        habits.forEach(h => h.checks.forEach((c, i) => { if(c) dStats[i]++; }));
        const done = habits.reduce((acc, h) => acc + h.checks.filter(c => c).length, 0);
        const total = habits.length * 7;
        const score = total ? Math.round((done/total)*100) : 0;

        history.push({ wk: weekNum, score: score, stats: dStats, count: habits.length });
        weekNum++;
        habits.forEach(h => h.checks = Array(7).fill(false));
        update();
    }

    function update() {
        localStorage.setItem('HF_FINAL_X_DATA', JSON.stringify(habits));
        localStorage.setItem('HF_FINAL_X_WK', weekNum);
        localStorage.setItem('HF_FINAL_X_HIST', JSON.stringify(history));
        render();
    }

    function drawWave(stats, count) {
        if(!count) return "";
        let path = "M 50 100"; let dots = "";
        stats.forEach((s, i) => {
            const pct = Math.round((s/count)*100);
            const x = (i * 100) + 50; const y = 100 - pct;
            path += ` L ${x} ${y}`;
            dots += `<circle cx="${x}" cy="${y}" r="5" class="wave-dot" />`;
        });
        path += " L 650 100 Z";
        return `<path d="${path}" class="wave-path"></path>${dots}`;
    }

    function render() {
        const body = document.getElementById('habitBody');
        let tDone = 0, tPoss = habits.length * 7, dStats = Array(7).fill(0);

        body.innerHTML = habits.map((h, hIdx) => {
            const hDone = h.checks.filter((c, i) => { if(c) dStats[i]++; return c; }).length;
            tDone += hDone;
            return `<tr>
                <td>${hIdx+1}</td>
                <td class="h-name">
                    <div class="action-btns">
                        <button class="btn-edit" onclick="openModal(${hIdx})" title="Edit">✏️</button>
                        <button class="btn-del" onclick="removeHabit(${hIdx})" title="Delete">🗑️</button>
                        <span style="margin-left:10px">${h.name}</span>
                    </div>
                </td>
                ${h.checks.map((c, dIdx) => `<td><input type="checkbox" ${c?'checked':''} onchange="toggle(${hIdx},${dIdx})"></td>`).join('')}
                <td style="font-weight:bold; color:var(--blue)">${Math.round((hDone/7)*100)}%</td>
            </tr>`;
        }).join('');

        const weeklyPct = tPoss ? Math.round((tDone/tPoss)*100) : 0;
        document.getElementById('mainGraph').innerHTML = drawWave(dStats, habits.length);
        document.getElementById('wPie').style.background = `conic-gradient(var(--blue) ${weeklyPct}%, #eee 0%)`;
        document.getElementById('wText').innerText = weeklyPct + "%";
        document.getElementById('wCount').innerText = `${tDone} / ${tPoss} DONE`;

        const overAvg = Math.round((history.reduce((a,b)=>a+b.score,0) + weeklyPct) / weekNum);
        document.getElementById('oPie').style.background = `conic-gradient(var(--navy) ${overAvg}%, #eee 0%)`;
        document.getElementById('oText').innerText = overAvg + "%";

        dStats.forEach((s, i) => document.getElementById(`c${i}`).innerText = (habits.length ? Math.round((s/habits.length)*100) : 0) + '%');
        document.getElementById('rowTotal').innerText = weeklyPct + '%';
        document.getElementById('week-label').innerText = `WEEK ${weekNum} / 16`;

        document.getElementById('historyBox').innerHTML = history.slice().reverse().map(h => `
            <div class="hist-card">
                <div style="display:flex; justify-content:space-between; font-weight:800; margin-bottom:10px;">
                    <span>WEEK ${h.wk}</span><span style="color:var(--blue)">${h.score}%</span>
                </div>
                <svg viewBox="0 0 700 100" style="width:100%; height:70px;">${drawWave(h.stats, h.count)}</svg>
            </div>
        `).join('');
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    render();
</script>
</body>
</html>
